# REQUIRED setup after clone (one-time, per working tree):
#   pip install pre-commit flake8 pytest
#   pre-commit install
# The second command writes .git/hooks/pre-commit. Without it this config
# is inert — committing this YAML alone does NOT activate the hook.
# Runs on every `git commit` and blocks if any hook fails.
# Uses system-language entries (language: system) to avoid pre-commit
# building its own venv — sidesteps a Windows permission issue with the
# default repo-based install. flake8 config honours the repo's .flake8 file.
#
# Stages: flake8 + SSA contract run at `pre-commit` (commit time);
# conventional-commit-msg at `commit-msg`; the full test suite at `pre-push`.
# `default_install_hook_types` lets a plain `pre-commit install` wire all three.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: python -m flake8
        language: system
        types: [python]
        pass_filenames: false
        args: ["."]

      # SSA Format Contract guard. Pinned constants in
      # pims/services/ssa_format_constants.py MUST match the rules in
      # docs/SSA_FORMAT_CONTRACT.md. The contract test asserts every
      # constant; if drift slips in, this hook blocks the commit.
      #
      # See ~/.claude/skills/ssa-audit-format/SKILL.md (or
      # docs/skills/ssa-audit-format/SKILL.md) for the change procedure
      # when you legitimately want to update a rule.
      #
      # Runs on every commit (51 assertions, ~0.3s total).
      - id: ssa-format-contract
        name: SSA Audit Format Contract
        entry: python -m pytest tests/test_audit_report_format_contract.py -q --no-header
        language: system
        pass_filenames: false
        always_run: true

      # Conventional Commits guard. Rejects commit messages whose subject
      # is not `type(scope): summary`. Merge/revert/fixup commits are exempt.
      # Runs at the commit-msg stage (after the editor closes).
      - id: conventional-commit-msg
        name: Conventional commit message
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
        always_run: true

      # Full test suite at push time. Commits stay fast (lint + contract);
      # this blocks publishing a red branch before it ever reaches CI.
      # `-x` stops at the first failure so a red push aborts quickly.
      - id: full-test-suite
        name: Full test suite (pre-push)
        entry: python -m pytest tests/ -x -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
